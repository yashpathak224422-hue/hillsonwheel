name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          echo "Pinging Render backend at $(date)..."
          curl -f -s -S --max-time 30 https://hillsonwheels-api.onrender.com/api/health || true
