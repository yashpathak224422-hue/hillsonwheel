name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier from sleeping (15 min inactivity limit)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Health Check
        run: |
          echo "Pinging HILLSONWHEELS backend to keep service warm..."
          curl -s -f -m 60 "https://hillsonwheels-api.onrender.com/api/health" || echo "Ping dispatched"
