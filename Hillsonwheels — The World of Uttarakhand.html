/* ── Kafal Dhrup ambient loop player ────────────────────────────── */
(function(){
  const SRC='/Kafal Dhrup Loop.m4a';
  let _el=null,_playing=false;

  function _getEl(){
    if(!_el){
      _el=document.createElement('audio');
      _el.src=SRC;
      _el.loop=true;
      _el.volume=0.55;
      _el.preload='none';
      document.body.appendChild(_el);
    }
    return _el;
  }

  function _updateBtn(){
    const b=$('#audio-btn');
    if(!b)return;
    if(_playing){
      b.textContent='KAFAL';
      b.className='audio-toggle on';
    }else{
      b.textContent='OFF';
      b.className='audio-toggle';
    }
  }

  window.MountainAudio={
    mode:'off',
    chime(){},
    toggle(){
      const a=_getEl();
      if(_playing){
        a.pause();
        _playing=false;
        this.mode='off';
      }else{
        a.play().catch(()=>{});
        _playing=true;
        this.mode='on';
      }
      _updateBtn();
    },
    updateUI:_updateBtn
  };

  /* Auto-start on first real user interaction */
  function _autoStart(){
    if(_playing)return;
    const a=_getEl();
    a.play().then(()=>{
      _playing=true;
      window.MountainAudio.mode='on';
      _updateBtn();
    }).catch(()=>{});
    document.removeEventListener('click',_autoStart,true);
    document.removeEventListener('keydown',_autoStart,true);
    document.removeEventListener('touchstart',_autoStart,true);
  }
  document.addEventListener('click',_autoStart,{capture:true,once:true});
  document.addEventListener('keydown',_autoStart,{capture:true,once:true});
  document.addEventListener('touchstart',_autoStart,{capture:true,once:true});
})();

/* Modal Controller */
function openModal(contentHtml){
  const m=$('#global-modal');
  if(!m)return;
  m.innerHTML=`<div class="modal-box"><div style="position:absolute;top:20px;right:24px;cursor:pointer;font-size:12px;opacity:.6" onclick="closeModal()">Close</div>${contentHtml}</div>`;
  m.classList.add('o');
}
function closeModal(e){
  if(e&&e.target!==$('#global-modal'))return;
  const m=$('#global-modal');if(m)m.classList.remove('o');
}

  `);
}

const DETAIL_CONTENT={
  'wool-loom':{type:'Craft',title:'Wool & Loom',image:'craft',summary:'A woven thread carries warmth, skill and the character of the place it comes from.',sections:[['The material','Wool has long been valued for warmth in Himalayan life. Fibre, weave and finish vary with makers, materials and the needs of the household.'],['The making','Preparing yarn and weaving ask for patience and close attention. Skills are learned through practice, observation and the sharing of knowledge across generations.'],['Why it matters','Value the maker as well as the object: ask who made it, how it was made and how to care for it.']],back:'craft',shop:true},
  'aipan-art':{type:'Craft',title:'Aipan Art',image:'aipan-weave',summary:'A line of white against a red ground can turn a threshold into a place of welcome. Aipan is an art of pattern, occasion and care.',sections:[['A living art','Aipan is a traditional folk art associated with Kumaon. Designs are commonly made with white rice paste over a prepared red or ochre ground, though practice can vary.'],['Patterns with purpose','Aipan appears in homes and ritual settings, often for particular occasions. The meanings of designs are best learned from people who practise the art.'],['Made for today','Artists continue to interpret Aipan in new forms. Appreciate it by crediting the artist and learning its context, not treating a living tradition as decoration alone.']],back:'craft',shop:true},
  'the-weaver':{type:'Makers',title:'The Weaver',image:'aipanartisan',summary:'Behind every woven piece is a maker who knows how a thread behaves, how a pattern grows and how a finished cloth should serve the person who uses it.',sections:[['Knowledge in the hands','Weaving brings together material knowledge, rhythm and design. Much of that understanding is built slowly—by watching, practising and learning from experienced makers.'],['A livelihood, a legacy','Fair recognition means crediting makers where they wish to be named and respecting their ownership of their work.'],['Look closer','Notice the texture, edges and small variations that reveal the work of a human hand. Ask about the material, process and care.']],back:'craft',shop:true},
  'terrace-farming':{type:'People & Spirit',title:'Life on the Terraces',image:'terraces',summary:'Terraced fields turn steep slopes into carefully held ground. They are shaped by seasonal work and the people who keep returning to the soil.',sections:[['Reading the season','Crops and calendars vary with elevation, water and local conditions. Farmers make decisions by observing rain, soil and the changing year.'],['More than a view','Terraces are working landscapes. Their walls, paths and water channels need care, and their harvests connect households to local food traditions.'],['A changing future','Migration, shifting rainfall and access to markets all affect mountain farming. Listening to farmers matters when considering what might help.']],back:'people'},
  'mountain-craft':{type:'People & Spirit',title:'Craft, Skill & Community',image:'craft',summary:'A handmade object can hold a map of local materials, family teaching and creative decisions. Craft is not frozen in the past; it changes as makers shape what comes next.',sections:[['Made with knowledge','Textiles, bamboo work, woodwork and folk arts each call for their own tools and techniques.'],['Keeping skill visible','Learning opportunities, fair payment and proper credit help craft knowledge remain valued.'],['Tradition in motion','New forms can sit alongside inherited techniques. Ask who is making the work, who benefits and whether the tradition is represented with respect.']],back:'people'},
  'folk-music':{type:'People & Spirit',title:'Songs Carried Through the Hills',image:'chholiya',summary:'Songs travel through memory, gatherings and the voices of people who know the words by heart.',sections:[['Many voices','Uttarakhand holds varied musical traditions across regions and languages. Songs may accompany celebration, devotion, work or storytelling.'],['A shared practice','Music is often experienced together. Instruments, rhythms and words can carry meanings specific to their community.'],['Listen with respect','Recordings and performances deserve credit and consent. Seek context and permission from the people who keep a song alive.']],back:'people'},
  'village-shrines':{type:'People & Spirit',title:'Shrines, Faith & Place',image:'jageshwar',summary:'A shrine may be a place of prayer and a thread in the community’s relationship with its surroundings. Its meaning belongs first to the people who care for it.',sections:[['Local sacred geographies','Places of worship and reverence take many forms. Their histories and practices are distinct.'],['Everyday devotion','Faith can be present in seasonal gatherings, household practice and the care given to a sacred place.'],['Visit thoughtfully','Ask before photographing people or ceremonies, follow local guidance and treat a living place of worship with respect.']],back:'people'},
  'seasonal-gatherings':{type:'People & Spirit',title:'Festivals & Seasonal Gatherings',image:'badrinath',summary:'A gathering can mark a season, renew relationships and bring music, food and custom into shared view.',sections:[['Rooted in locality','Celebrations vary across Uttarakhand. Their timing, stories and practices belong to particular communities.'],['More than a spectacle','For residents, a festival can be an act of devotion, memory and belonging. Visitors are guests in that moment.'],['Be a considerate guest','Follow local instructions, ask before taking photographs and support community-led events in ways residents welcome.']],back:'people'},
  'river-reverence':{type:'People & Spirit',title:'Rivers & Reverence',image:'devprayag',summary:'Mountain rivers shape valleys and daily life. For many people they also hold deep spiritual meaning.',sections:[['A living watershed','Streams connect forests, settlements and farms. Their health depends on the wider landscape and the choices made throughout a catchment.'],['Meaning and responsibility','Reverence may be expressed through prayer, custom and care. Protecting riverbanks from waste is a practical way to show regard.'],['Leave no trace','Carry rubbish out, use established access points and follow safety guidance. Waterways are powerful natural systems.']],back:'people'}
};

const BLOGS=[
  {id:'terraces-and-seasons',category:'Land & Living',title:'The Quiet Architecture of a Terraced Field',image:'terraces',dek:'Across a steep hillside, stone edges hold more than soil: they hold the work of many seasons.',read:'5 min read',paragraphs:['From a distance, a mountain terrace can look like a pattern drawn across a slope. Up close, it is carefully shaped ground where crops can grow on difficult terrain.','Each terrace depends on attention: walls need care, water must be managed and the work follows local seasons. What grows, and when, varies with altitude, weather and household choices.','These fields are not scenery set aside for a visitor. They are lived and worked places. A thoughtful walk keeps to paths, asks before entering fields and recognises the people whose labour sustains the landscape.']},
  {id:'grain-to-kitchen',category:'Food & Memory',title:'From Mountain Grain to the Family Kitchen',image:'pahadi-pulses',dek:'Mandua, jhangora, bhatt and gahat each bring a different story of soil, season and cooking.',read:'4 min read',paragraphs:['The names of Uttarakhand’s grains and pulses are more than entries on a menu. Mandua, jhangora, bhatt and gahat each have their own texture and place in regional foodways.','Recipes are not fixed in one form. Ingredients and methods shift between households and regions, shaped by what is available and what people have learned to cook well. Dishes such as kafuli and chainsoo carry that everyday creativity.','To learn a food tradition, start with the cook. Ask how an ingredient is chosen, prepared and served, and credit the people whose knowledge makes the meal possible.']},
  {id:'aipan-and-welcome',category:'Art & Craft',title:'Aipan: A Pattern Made for a Moment',image:'aipan-weave',dek:'Kumaoni Aipan brings line, ground and occasion together in a living folk-art practice.',read:'4 min read',paragraphs:['Aipan is a traditional folk art associated with Kumaon. Commonly made with white rice paste on a red or ochre ground, its patterns are connected with homes and ritual occasions.','There is no single pattern that explains every practice. Designs and meanings can vary, and the most thoughtful way to learn is from the artists and families who continue the work.','Aipan continues to find new forms, but the tradition remains more than a motif. Credit the artist, ask about context and let the maker guide how their work is represented.']},
  {id:'visiting-with-care',category:'Travel & Respect',title:'How to Be a Thoughtful Guest in a Mountain Village',image:'village',dek:'A slower visit begins with listening—to local guidance, daily rhythms and the limits of the landscape.',read:'3 min read',paragraphs:['A village is someone’s home before it is anyone’s destination. Begin by following local guidance and asking before photographing people, homes or ceremonies.','Stay on paths, keep noise low and take rubbish back with you. Water and road access can be limited, so conserve water, avoid waste and support local businesses where residents welcome it.','The best visit is not measured by how much you consume. It is measured by how carefully you listen, how lightly you travel and whether the community has a say in how visitors are welcomed.']}
];

function copyCouponCode(btn, code){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      if(btn){
        const orig = btn.innerText;
        btn.innerText = 'COPIED!';
        setTimeout(()=>{ btn.innerText = orig; }, 2000);
      }
    }).catch(()=>{});
  }
}

function initImpactCounters(){
  const els = document.querySelectorAll('.hsw-impact-number[data-target]');
  if(!els.length) return;
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const el = entry.target;
        obs.unobserve(el);
        const target = parseInt(el.getAttribute('data-target'), 10) || 0;
        const suffix = el.getAttribute('data-suffix') || '';
        const duration = 1600;
        const startTime = performance.now();
        function update(now){
          const progress = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          const current = Math.floor(ease * target);
          el.textContent = current.toLocaleString('en-IN') + suffix;
          if(progress < 1){
            requestAnimationFrame(update);
          } else {
            el.textContent = target.toLocaleString('en-IN') + suffix;
          }
        }
        requestAnimationFrame(update);
      }
    });
  }, { threshold: 0.2 });

  els.forEach(el => observer.observe(el));
}

function recalcBooking(basePrice){
  const guests = parseInt(document.getElementById('book-guests')?.value || 2, 10);
  const stayExtra = parseInt(document.getElementById('book-stay')?.value || 0, 10);
  const total = (basePrice * guests) + (stayExtra * 3) + (guests * 600);

  const gLabel = document.getElementById('calc-guests-label');
  const bPrice = document.getElementById('calc-base-price');
  const pPrice = document.getElementById('calc-permit-price');
  const tPrice = document.getElementById('calc-total-price');

  if(gLabel) gLabel.textContent = `${guests} Guests`;
  if(bPrice) bPrice.textContent = `₹ ${(basePrice * guests).toLocaleString('en-IN')}`;
  if(pPrice) pPrice.textContent = `₹ ${(guests * 600).toLocaleString('en-IN')}`;
  if(tPrice) tPrice.textContent = `₹ ${total.toLocaleString('en-IN')}`;
}
window.recalcBooking = recalcBooking;

async function submitExpeditionBooking(encodedTitle, basePrice, journeyId){
  const title = decodeURIComponent(encodedTitle);
  const date = document.getElementById('book-date')?.value;
  const guests = parseInt(document.getElementById('book-guests')?.value || 2, 10);
  const stay = document.getElementById('book-stay')?.value;
  const diet = document.getElementById('book-diet')?.value;
  const total = (basePrice * guests) + (guests * 600);

  if(!accountUser){
    closeModal();
    sessionStorage.setItem('hsw-auth-return', 'booking');
    sessionStorage.setItem('hsw-pending-booking', JSON.stringify({ title, date, guests, total, journeyId }));
    go('login');
    if(window.EcommerceStore && window.EcommerceStore.showToast){
      window.EcommerceStore.showToast('Please sign in or create an account to secure your booking', 'info');
    }
    return;
  }

  try{
    const res = await fetch('/api/trips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        destination: title,
        departureDate: date,
        travelersCount: guests,
        preference: diet,
        notes: `Stay addon: ₹${stay}. Total quoted: ₹${total}`
      })
    });

    closeModal();
    if(res.ok){
      openModal(`
        <div class="lab" style="color:#86efac">Booking Received</div>
        <h2 style="margin:8px 0 14px;font-size:32px">Journey Reserved: ${title}</h2>
        <p style="font-size:14px;line-height:1.75;opacity:.88;margin-bottom:20px">Thank you, ${accountUser.name || 'Patron'}. Your high-altitude expedition reservation for <strong>${date}</strong> (${guests} guests) has been submitted to the local mountain expedition team. An official confirmation email with trek logistics has been dispatched.</p>
        <button class="btn on" style="width:100%" onclick="closeModal();go('orders')">View My Mountain Bookings</button>
      `);
    } else {
      throw new Error('Server returned an error');
    }
  }catch(err){
    openModal(`
      <div class="lab" style="color:var(--gold)">Booking Confirmation Pending</div>
      <h2 style="margin:8px 0 14px;font-size:28px">${title}</h2>
      <p style="font-size:14px;line-height:1.75;opacity:.85;margin-bottom:20px">Your reservation details have been captured locally for ${guests} guests on ${date}. Our human concierge will contact you via WhatsApp / phone to confirm village availability.</p>
      <button class="btn on" style="width:100%" onclick="closeModal()">Return to Website</button>
    `);
  }
}

/* Altitude Scrolly HUD Indicator */
function initAltitudeHUD(){
  let hud = document.getElementById('altitude-hud');
  if(!hud){
    hud = document.createElement('div');
    hud.id = 'altitude-hud';
    hud.className = 'altitude-hud';
    hud.innerHTML = `<span class="altitude-hud-dot"></span><span id="altitude-hud-text">Elev: 340 m · Rishikesh</span>`;
    document.body.appendChild(hud);
  }

  const ALT_STOPS = [
    { p: 0, alt: 340, name: 'Rishikesh' },
    { p: 0.15, alt: 830, name: 'Devprayag' },
    { p: 0.35, alt: 1640, name: 'Almora Ridge' },
    { p: 0.55, alt: 2200, name: 'Munsiyari' },
    { p: 0.75, alt: 2850, name: 'Auli Bugyal' },
    { p: 0.90, alt: 3680, name: 'Tungnath High Shrine' }
  ];

  function onScroll(){
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if(max <= 0) return;
    const progress = Math.min(1, Math.max(0, window.scrollY / max));
    
    let current = ALT_STOPS[0];
    for(let i = 0; i < ALT_STOPS.length; i++){
      if(progress >= ALT_STOPS[i].p){
        current = ALT_STOPS[i];
      }
    }
    const txt = document.getElementById('altitude-hud-text');
    if(txt) txt.textContent = `Elev: ${current.alt} m · ${current.name}`;
  }

  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
}

      return nav()+`<div class="light" style="padding-top:110px"><h1 style="font-size:42px;margin:10px 0 24px">Checkout</h1><p>Loading checkout…</p></div>`+FOOT;

    case 'confirm':
      return nav()+hero('about','Order Confirmed','Thank you.','Your order is confirmed. You can follow its dispatch from your account.',`<button class="btn on" onclick="go('orders')">View My Orders & Track</button>`)+FOOT;

    case 'order-success':
      if (window.EcommerceStore && window.EcommerceStore.renderOrderSuccess && sel.orderId) {
        return nav() + window.EcommerceStore.renderOrderSuccess(sel.orderId, sel.orderNumber, sel.orderTracking, sel.orderTotal) + FOOT;
      }
      return nav()+hero('about','Order Received','Thank you.','Your order has been saved. Our team will follow up using your account contact details.',`<p class="lab">Reference ${Security.escapeHTML(sel.orderId||'')}</p><p style="margin:10px 0 22px">${sel.orderEmailSent?'The order team has been notified.':'Team email notifications are waiting for email service configuration.'}</p><button class="btn on" onclick="go('orders')">Track Mountain Order</button>`)+FOOT;

    case 'admin':
      if (window.AdminStore) {
        setTimeout(() => window.AdminStore.render(), 10);
        return `<div id="admin-mount" style="background:#0f100d;min-height:100vh"></div>`;
      }
      return nav()+`<div class="light" style="padding-top:120px;text-align:center"><h2>Loading Admin Console…</h2></div>`+FOOT;
  }
}

function sr(v){
  const term=(v||'').toLowerCase();
  $('#sr').innerHTML=PROD.filter(x=>!term||(x[0]+x[1]+x[4]+x[5]).toLowerCase().includes(term)).map(x=>card(x[3],x[0],'From '+x[1]+' · ₹'+x[2]+'<br><span style="font-size:11px;opacity:.8">'+x[5]+'</span>','product')).join('');
}

window._hswPostRender = function(p) {
  setTimeout(() => {
    initImpactCounters();
    initAltitudeHUD();
    if (p === 'home') {
      const v = document.getElementById('hero-drone-video');
      if (v && v.paused) v.play().catch(() => {});
    }
  }, 60);
};

async function render(p,still){
  cur=p;
  const pageTitles = {
    open: 'Hillsonwheels — The World of Uttarakhand',
    home: 'The World of Uttarakhand — Hillsonwheels',
    land: 'Awakening · Uttarakhand — Hillsonwheels',
    awakening: 'Awakening · Uttarakhand — Hillsonwheels',
    unfold: 'Unfold · Discover Uttarakhand — Hillsonwheels',
    magnifying: 'Magnifying · Ideas for Tomorrow — Hillsonwheels',
    detail: (DETAIL_CONTENT[sel.detailId]?.title || 'Discoveries') + ' — Hillsonwheels',
    blog: (BLOGS.find(post=>post.id===sel.blogId)?.title || 'Stories · The Hill Journal') + ' — Hillsonwheels',
    bazaar: 'Pahad Ki Bazaar · Mountain Direct Produce — Hillsonwheels',
    craft: 'The Craft · Himalayan Handlooms & Craft — Hillsonwheels',
    journey: 'Pahad Ki Sair · Treks & Expeditions — Hillsonwheels',
    people: 'People & Spirit · Himalayan Communities — Hillsonwheels',
    soul: 'People & Spirit · Himalayan Communities — Hillsonwheels',
    map: 'Interactive 3D Map of Uttarakhand — Hillsonwheels',
    stories: 'Mountain Chronicles & Stories — Hillsonwheels',
    about: 'About Hillsonwheels — Heritage & Direct-from-Farmer',
    search: 'Search Catalog & Treks — Hillsonwheels',
    login: 'Account Sign In — Hillsonwheels',
    custom: 'Plan Custom Mountain Journey — Hillsonwheels',
    checkout: 'Secure Checkout — Hillsonwheels',
    orders: 'My Orders & Live Logistics — Hillsonwheels',
    account: 'My Account & Mountain Club — Hillsonwheels',
    dest: (sel.journeyId ? (window.LIVE_JOURNEYS?.find(j => j.id === sel.journeyId)?.title || 'Expedition Guide') : 'Auli & Mountain Expeditions') + ' — Hillsonwheels'
  };
  Object.entries(FOOTER_PAGES).forEach(([route,page])=>{pageTitles[route]=`${page.title} — Hillsonwheels`});
  if (pageTitles[p]) document.title = pageTitles[p];

  const a=$('#app');
  a.innerHTML=P(p);
  
  if (p === 'orders' || p === 'account') {
    const mount = document.getElementById('ecommerce-orders-mount');
    if (mount && window.EcommerceStore && window.EcommerceStore.renderOrdersDashboard) {
      mount.innerHTML = await window.EcommerceStore.renderOrdersDashboard();
      if (window._hswPostRender) window._hswPostRender(p);
    }
  }

  a.querySelectorAll('.rv').forEach((e,i)=>e.style.animationDelay=(.12+i*.08)+'s');
  if(!still)a.scrollTop=0;
  if(p==='search')sr($('#q')?$('#q').value:'');
  if (window._hswPostRender) window._hswPostRender(p);
}

function go(p,still,fromHistory){
  if(p==='land')p='awakening';
  if(p==='soul')p='people';
  if(still){
    window.cur = p;
    cur = p;
    return render(p, 1);
  }
  if(window.cur===p && !fromHistory && p!=='open')return;
  window.cur = p;
  cur = p;
  if(!fromHistory && p!=='open'){
    history.pushState({p}, '', '#'+p);
  }
  const c=$('#cu');
  $('#cl').textContent=p.toUpperCase();
  if($('#cl-sub') && window.PROVERBS && PROVERBS.length){
    const prv = PROVERBS[Math.floor(Math.random()*PROVERBS.length)];
    $('#cl-sub').textContent = `"${prv.quote}" — ${prv.meaning}`;
  }
  c.className='curtain in';
  setTimeout(()=>{render(p);c.className='curtain out'},600);
}
window.go = go;

let introTimer1 = null;
let introTimer2 = null;
let introInterval = null;

function clearIntroTimers() {
  if (introTimer1) { clearTimeout(introTimer1); introTimer1 = null; }
  if (introTimer2) { clearTimeout(introTimer2); introTimer2 = null; }
  if (introInterval) { clearInterval(introInterval); introInterval = null; }
}

function open_(){
  if (sessionStorage.getItem('hsw_intro_seen')) {
    go('home', false, true);
    return;
  }
  cur = 'open';
  clearIntroTimers();

  $('#app').innerHTML = `<div onclick="skipIntro()" style="height:100%;display:grid;place-items:center;text-align:center;position:relative;cursor:pointer"><svg viewBox="0 0 400 200" style="width:min(80vw,520px)"><path id="mt" d="M10 170L90 110 140 130 200 40 250 100 290 80 390 170" fill="none" stroke="#C5A869" stroke-width="1.2" stroke-dasharray="700" stroke-dashoffset="700" style="animation:dr 5s ease forwards"/></svg></div><style>@keyframes dr{to{stroke-dashoffset:0}}</style>`;

  introTimer1 = setTimeout(() => {
    reveal();
  }, 5000);
}

function reveal(){
  clearIntroTimers();
  const w = ['forests', 'rivers', 'villages', 'food', 'craft', 'people', 'temples', 'roads', 'journeys'];
  $('#app').innerHTML = `<div onclick="skipIntro()" style="height:100%;display:grid;place-items:center;text-align:center;cursor:pointer"><div><div class="lab" id="w" style="height:20px;margin-bottom:36px;letter-spacing:.32em"></div><div style="display:flex;align-items:center;justify-content:center;gap:12px"><h1 class="rv" style="letter-spacing:.32em;font-size:clamp(28px,6vw,76px);animation-delay:2.8s;display:inline-block">HILLSONWHEELS</h1></div><p class="lab rv" style="margin:16px 0 40px;letter-spacing:.35em;animation-delay:3.5s">The world of Uttarakhand</p></div></div>`;

  let i = 0;
  introInterval = setInterval(() => {
    if (i >= w.length) {
      if (introInterval) clearInterval(introInterval);
      return;
    }
    const word = $('#w');
    if (!word) {
      if (introInterval) clearInterval(introInterval);
      return;
    }
    word.textContent = w[i++];
  }, 300);

  introTimer2 = setTimeout(() => {
    skipIntro();
  }, 4500);
}

function skipIntro() {
  clearIntroTimers();
  try { sessionStorage.setItem('hsw_intro_seen', '1'); } catch (_) {}
  go('home');
}
window.skipIntro = skipIntro;

window.addEventListener('popstate', e => {
  if (e.state && e.state.p) {
    go(e.state.p, false, true);
  } else if (location.hash && location.hash.length > 1) {
    go(location.hash.substring(1), false, true);
  } else {
    go('home', false, true);
  }
});
if (location.hash && location.hash.length > 1) {
  go(location.hash.substring(1), false, true);
} else {
  open_();
}

/* ========== LUXURY MOTION & INTERACTION ENGINE ========== */
(function() {
  // Scroll Progress Bar
  window.addEventListener('scroll', () => {
    const bar = document.getElementById('scroll-progress');
    if (!bar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? (window.scrollY / h) * 100 : 0;
    bar.style.width = p + '%';
  });

  // Parallax 3D Card Tilt
  document.addEventListener('mousemove', e => {
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom) {
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `perspective(1000px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateY(-8px) scale(1.02)`;
      } else {
        card.style.transform = '';
      }
    });
  });
})();
