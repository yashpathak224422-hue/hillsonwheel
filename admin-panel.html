<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HILLSONWHEELS — Vendor & Admin Console</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b09;
      --card: #111210;
      --card2: #161714;
      --border: rgba(197,168,105,0.18);
      --border2: #1e2019;
      --gold: #C5A869;
      --gold2: #DFCA9A;
      --tx: #E9E3D5;
      --tx2: #9a9f92;
      --tx3: #636860;
      --red: #ef4444;
      --green: #22c55e;
      --blue: #3b82f6;
      --orange: #f97316;
      --sans: 'Manrope', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }

    /* ── Login Screen ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(197,168,105,0.07) 0%, transparent 70%), var(--bg);
    }
    .login-card {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 44px 40px; width: min(440px, 100%);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .login-brand { text-align: center; margin-bottom: 36px; }
    .login-brand .wordmark { font-weight: 900; letter-spacing: 3px; font-size: 22px; color: var(--gold); display: block; }
    .login-brand .sub { font-size: 10px; letter-spacing: 2px; color: var(--tx3); text-transform: uppercase; margin-top: 6px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--tx2); margin-bottom: 7px; }
    .form-group input {
      width: 100%; padding: 13px 14px;
      background: #0d0e0c; border: 1px solid #2a2c25; border-radius: 5px;
      color: var(--tx); font: inherit; font-size: 14px; transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--gold); }
    .btn-primary {
      width: 100%; padding: 14px; background: var(--gold); color: #0a0b09;
      border: none; border-radius: 5px; font: 700 13px/1 var(--sans);
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: all 0.25s; margin-top: 8px;
    }
    .btn-primary:hover { background: var(--gold2); box-shadow: 0 6px 20px rgba(197,168,105,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #login-error { color: #f87171; font-size: 12px; text-align: center; margin-top: 12px; min-height: 18px; }
    .login-footer { text-align: center; margin-top: 24px; }
    .login-footer a { color: var(--tx3); font-size: 11px; cursor: pointer; text-decoration: none; }
    .login-footer a:hover { color: var(--gold); }

    /* ── Shell ── */
    #shell { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
    #shell.visible { display: flex; }

    /* ── Top Bar ── */
    .topbar {
      background: #0d0e0b; border-bottom: 1px solid var(--border2);
      padding: 0 24px; height: 58px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0; gap: 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-brand { font-weight: 900; letter-spacing: 2.5px; font-size: 16px; color: var(--gold); }
    .topbar-badge {
      background: rgba(197,168,105,0.12); color: var(--gold);
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 9px;
      border-radius: 99px; text-transform: uppercase; border: 1px solid rgba(197,168,105,0.2);
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .topbar-user { color: var(--tx2); }
    .topbar-user strong { color: var(--tx); }
    .btn-sm {
      padding: 7px 14px; border-radius: 4px; font: 600 11px/1 var(--sans);
      letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s;
    }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--tx2); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { background: none; border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; background: #0c0d0b; border-right: 1px solid var(--border2);
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
      padding: 20px 0;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 20px;
      cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--tx3);
      border-left: 2px solid transparent; transition: all 0.18s;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .nav-item:hover { color: var(--tx); background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--gold); border-left-color: var(--gold); background: rgba(197,168,105,0.05); }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--gold); color: #0a0b09; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 99px; }
    .sidebar-section { padding: 16px 20px 8px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--tx3); text-transform: uppercase; }

    /* ── Main Content ── */
    .main { flex: 1; overflow-y: auto; padding: 28px; }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    /* ── Page Header ── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 22px; font-weight: 800; color: var(--tx); letter-spacing: -0.3px; }
    .page-sub { font-size: 12px; color: var(--tx3); margin-top: 4px; }

    /* ── KPI Cards ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .kpi-card {
      background: var(--card2); border: 1px solid var(--border2); border-radius: 7px;
      padding: 20px; transition: border-color 0.2s;
    }
    .kpi-card:hover { border-color: rgba(197,168,105,0.3); }
    .kpi-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--tx3); margin-bottom: 10px; }
    .kpi-value { font-size: 28px; font-weight: 800; color: var(--tx); line-height: 1; }
    .kpi-sub { font-size: 11px; color: var(--tx3); margin-top: 6px; }
    .kpi-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-top: 6px; }
    .kpi-pill.up { background: rgba(34,197,94,0.12); color: var(--green); }
    .kpi-pill.down { background: rgba(239,68,68,0.12); color: var(--red); }

    /* ── Tables ── */
    .table-wrap { background: var(--card2); border: 1px solid var(--border2); border-radius: 7px; overflow: hidden; }
    .table-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border2); gap: 12px; flex-wrap: wrap; }
    .table-title { font-weight: 700; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { background: #0d0e0b; color: var(--tx3); padding: 12px 16px; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; text-align: left; border-bottom: 1px solid var(--border2); white-space: nowrap; }
    tbody td { padding: 14px 16px; border-bottom: 1px solid #111310; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.018); }
    .empty-state { text-align: center; padding: 52px 20px; color: var(--tx3); }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* ── Status Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; white-space: nowrap; }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .badge-confirmed { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .badge-packaged { background: rgba(168,85,247,0.12); color: #c084fc; }
    .badge-dispatched { background: rgba(249,115,22,0.14); color: #fb923c; }
    .badge-transit { background: rgba(234,179,8,0.12); color: #facc15; }
    .badge-delivery { background: rgba(6,182,212,0.12); color: #22d3ee; }
    .badge-delivered { background: rgba(34,197,94,0.12); color: #4ade80; }
    .badge-cancelled { background: rgba(239,68,68,0.12); color: #f87171; }
    .badge-paid { background: rgba(34,197,94,0.12); color: #4ade80; }
    .badge-pending { background: rgba(234,179,8,0.12); color: #facc15; }
    .badge-cod { background: rgba(249,115,22,0.12); color: #fb923c; }
    .badge-refunded { background: rgba(239,68,68,0.12); color: #f87171; }

    /* ── Action Buttons ── */
    .btn-action {
      padding: 5px 12px; border-radius: 4px; font: 600 11px/1 var(--sans);
      cursor: pointer; border: 1px solid var(--border); color: var(--tx2);
      background: none; transition: all 0.18s;
    }
    .btn-action:hover { border-color: var(--gold); color: var(--gold); }
    .btn-action.gold { border-color: var(--gold); color: var(--gold); }
    .btn-action.gold:hover { background: var(--gold); color: #0a0b09; }
    .btn-action.danger { border-color: rgba(239,68,68,0.35); color: #f87171; }
    .btn-action.danger:hover { background: rgba(239,68,68,0.1); }

    /* ── Search & Filter bar ── */
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-box { position: relative; }
    .search-box input {
      padding: 8px 12px 8px 34px; background: var(--card); border: 1px solid var(--border2);
      border-radius: 5px; color: var(--tx); font: inherit; font-size: 12.5px;
      width: 220px; transition: border-color 0.2s;
    }
    .search-box::before { content: ''; position: absolute; left: 11px; top: 50%; width: 7px; height: 7px; border: 1.5px solid var(--tx3); border-radius: 50%; transform: translateY(-50%); box-sizing: border-box; }
    .search-box::after { content: ''; position: absolute; left: 18px; top: 50%; width: 4px; height: 1.5px; background: var(--tx3); transform: translateY(2px) rotate(45deg); transform-origin: left top; }
    .filter-select {
      padding: 8px 12px; background: var(--card); border: 1px solid var(--border2);
      border-radius: 5px; color: var(--tx2); font: inherit; font-size: 12px; cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--gold); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      z-index: 100; display: grid; place-items: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #141512; border: 1px solid var(--border); border-radius: 10px;
      width: min(580px, 100%); max-height: 88vh; overflow-y: auto;
      padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      transform: translateY(14px); transition: transform 0.25s;
    }
    .modal-backdrop.open .modal-box { transform: translateY(0); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; border-bottom: 1px solid var(--border2); padding-bottom: 16px; }
    .modal-head h3 { font-size: 17px; font-weight: 700; }
    .modal-body-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media(max-width:500px){ .modal-body-row { grid-template-columns: 1fr; } }
    .modal-field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--tx3); margin-bottom: 6px; }
    .modal-field input, .modal-field select, .modal-field textarea {
      width: 100%; padding: 10px 12px; background: var(--card); border: 1px solid var(--border2);
      border-radius: 5px; color: var(--tx); font: inherit; font-size: 13px; transition: border-color 0.2s;
    }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { outline: none; border-color: var(--gold); }
    .modal-field textarea { resize: vertical; min-height: 70px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    /* ── Product grid ── */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .product-card {
      background: var(--card2); border: 1px solid var(--border2); border-radius: 7px;
      padding: 18px; transition: border-color 0.2s;
    }
    .product-card:hover { border-color: rgba(197,168,105,0.25); }
    .product-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .product-sku { font-size: 10px; color: var(--tx3); letter-spacing: 0.5px; margin-bottom: 10px; }
    .product-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .product-meta-item label { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--tx3); margin-bottom: 3px; }
    .product-meta-item span { font-size: 13px; font-weight: 700; color: var(--tx); }
    .stock-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .stock-btn { width: 28px; height: 28px; border-radius: 4px; background: var(--card); border: 1px solid var(--border2); color: var(--tx); font-size: 16px; cursor: pointer; display: grid; place-items: center; transition: all 0.18s; }
    .stock-btn:hover { border-color: var(--gold); color: var(--gold); }
    .stock-val { font-weight: 700; font-size: 16px; min-width: 36px; text-align: center; }

    /* ── Toast ── */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 13px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #fff; animation: toastIn 0.3s ease; box-shadow: 0 6px 20px rgba(0,0,0,0.5); max-width: 320px; }
    .toast.success { background: #166534; border: 1px solid #22c55e44; }
    .toast.error { background: #7f1d1d; border: 1px solid #ef444444; }
    .toast.info { background: #1e3a5f; border: 1px solid #3b82f644; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

    /* ── Loading ── */
    .loading { display: flex; align-items: center; gap: 10px; padding: 40px; color: var(--tx3); }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats row ── */
    .stat-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-item { display: flex; align-items: center; gap: 8px; background: var(--card2); border: 1px solid var(--border2); border-radius: 6px; padding: 10px 16px; }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stat-label { font-size: 11px; color: var(--tx3); }
    .stat-val { font-weight: 800; font-size: 16px; }

    /* ── Responsive ── */
    @media(max-width:768px){
      .sidebar { display: none; }
      .kpi-grid { grid-template-columns: repeat(2,1fr); }
      .topbar-user { display: none; }
      .search-box input { width: 150px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN SCREEN ═══════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="wordmark">HILLSONWHEELS</span>
      <span class="sub">Vendor & Admin Management Console</span>
    </div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="u-id">Admin ID</label>
        <input type="text" id="u-id" name="username" placeholder="admin@1234" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="u-pw">Password</label>
        <input type="password" id="u-pw" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Authenticate & Enter Console</button>
      <div id="login-error"></div>
    </form>
    <div class="login-footer">
      <a onclick="window.location.href='/'">← Return to Storefront</a>
    </div>
  </div>
</div>

<!-- ═══════════════ ADMIN SHELL ═══════════════ -->
<div id="shell">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">HILLSONWHEELS</span>
      <span class="topbar-badge">Vendor Console</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-user">Signed in as <strong id="top-user">admin@1234</strong></span>
      <button class="btn-sm btn-outline" onclick="window.open('/', '_blank')">View Storefront</button>
      <button class="btn-sm btn-danger" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- Layout -->
  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-section">Main</div>
      <div class="nav-item active" data-tab="overview" onclick="switchTab('overview')">
        <span class="icon">•</span> Overview
      </div>
      <div class="sidebar-section">Operations</div>
      <div class="nav-item" data-tab="orders" onclick="switchTab('orders')">
        <span class="icon">•</span> Orders
        <span class="nav-badge" id="pending-badge">0</span>
      </div>
      <div class="nav-item" data-tab="products" onclick="switchTab('products')">
        <span class="icon">•</span> Products
      </div>
      <div class="nav-item" data-tab="packages" onclick="switchTab('packages')">
        <span class="icon">•</span> Packages
      </div>
      <div class="nav-item" data-tab="trips" onclick="switchTab('trips')">
        <span class="icon">•</span> Tourism Leads
        <span class="nav-badge" id="trips-badge">0</span>
      </div>
    </nav>

    <!-- Main -->
    <main class="main" id="main-content">
      <div class="loading"><div class="spinner"></div> Loading dashboard…</div>
    </main>
  </div>
</div>

<!-- ═══════════════ MODAL ═══════════════ -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- ═══════════════ TOAST ═══════════════ -->
<div id="toast-container"></div>

<script>
/* ═════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const S = {
  token: localStorage.getItem('hsw_admin_token') || '',
  user: null,
  tab: 'overview',
  stats: null,
  orders: [],
  products: [],
  packages: [],
  trips: [],
  search: '',
  statusFilter: 'all'
};

/* ═════════════════════════════════════════
   AUTH
═══════════════════════════════════════════ */
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  const u = document.getElementById('u-id').value.trim();
  const p = document.getElementById('u-pw').value;
  btn.disabled = true;
  btn.textContent = 'Authenticating…';
  err.textContent = '';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Authentication failed.');
    S.token = data.token;
    S.user = data.admin;
    localStorage.setItem('hsw_admin_token', data.token);
    document.getElementById('top-user').textContent = S.user?.username || u;
    showShell();
  } catch (err2) {
    err.textContent = err2.message;
    btn.disabled = false;
    btn.textContent = 'Authenticate & Enter Console';
  }
}

async function verifySession() {
  if (!S.token) return false;
  try {
    const res = await fetch('/api/admin/verify', {
      headers: { 'Authorization': `Bearer ${S.token}` }
    });
    if (!res.ok) { doLogout(false); return false; }
    const data = await res.json();
    S.user = data;
    document.getElementById('top-user').textContent = data.username || 'admin@1234';
    return true;
  } catch { return false; }
}

function doLogout(notify = true) {
  S.token = ''; S.user = null;
  localStorage.removeItem('hsw_admin_token');
  fetch('/api/admin/logout', { method: 'POST' }).catch(() => {});
  if (notify) toast('Signed out from Admin Console', 'info');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('shell').classList.remove('visible');
  document.getElementById('u-pw').value = '';
  document.getElementById('login-btn').disabled = false;

/* ═════════════════════════════════════════
   API HELPERS
═══════════════════════════════════════════ */
async function api(method, path, body) {
  const opts = {
    method, headers: { 'Authorization': `Bearer ${S.token}` }
  };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch('/api/admin' + path, opts);
  if (res.status === 401) { doLogout(false); throw new Error('Session expired.'); }
  const data = res.status === 204 ? {} : await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

/* ═════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  loadTab(tab);
}

async function loadTab(tab) {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;
  try {
    if (tab === 'overview') await loadOverview();
    else if (tab === 'orders') await loadOrders();
    else if (tab === 'products') await loadProducts();
    else if (tab === 'packages') await loadPackages();
    else if (tab === 'trips') await loadTrips();
  } catch (e) {
    mc.innerHTML = `<div class="empty-state"><div class="icon">!</div><p>${e.message}</p></div>`;
  }
}

async function submitOrderUpdate(id, form) {

    await loadOrders();

async function adjustStock(sku, delta) {
  const prod = S.products.find(p => p.sku === sku);
  if (!prod) return;
  const newStock = Math.max(0, (prod.inStock || 0) + delta);
  try {
    await api('PUT', `/products/${encodeURIComponent(sku)}`, { inStock: newStock });
    prod.inStock = newStock;
    loadProducts();
  } catch (e) { toast(e.message, 'error'); }
}

async function submitProduct(form, isEdit) {
  const data = {
    sku: form.sku.value.trim(),
    name: form.name.value.trim(),
    variant: form.variant.value.trim(),
    weight: form.weight.value.trim(),
    unitPrice: Number(form.unitPrice.value),
    mrp: Number(form.mrp.value || form.unitPrice.value),
    category: form.category.value,
    inStock: Number(form.inStock.value || 0),
    origin: form.origin.value.trim(),
    description: form.description.value.trim(),
    benefits: form.benefits.value.split(',').map(b => b.trim()).filter(Boolean),
    photoKey: form.photoKey.value.trim() || 'p1',
    isAvailable: form.isAvailable.checked
  };
  try {
    if (isEdit) {
      await api('PUT', `/products/${encodeURIComponent(data.sku)}`, data);
      toast('Product updated!', 'success');
    } else {
      await api('POST', '/products', data);
      toast('Product published!', 'success');
    }
    closeModal();
    await loadProducts();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteProduct(sku) {
  if (!confirm(`Remove "${sku}" from the catalog?`)) return;
  try {
    await api('DELETE', `/products/${encodeURIComponent(sku)}`);
    toast('Product removed', 'info');
    await loadProducts();
  } catch (e) { toast(e.message, 'error'); }
}

          <div style="font-size:11px;color:var(--tx3);margin-bottom:12px;line-height:1.5">${esc(p.description||'').slice(0,80)}${(p.description||'').length>80?'…':''}</div>
          <div style="display:flex;gap:8px">
            <button class="btn-action" style="flex:1" onclick="openPackageModal('${esc(p.id)}')">Edit</button>
            <button class="btn-action danger" onclick="deletePackage('${esc(p.id)}')">Remove</button>
          </div>
        </div>
      `).join('') || '<div class="empty-state"><div class="icon">—</div><p>No packages yet. Add your first tourism package.</p></div>'}
    </div>
  `;
}

function resolvePhotoUrl(key) {
  if (!key) return 'https://images.unsplash.com/photo-1653545709914-cbb1b2748e13?w=400&q=70';
  if (key.startsWith('http://') || key.startsWith('https://') || key.startsWith('/') || key.startsWith('data:')) return key;
  const MAP = {
    hero: 'https://images.unsplash.com/photo-1653545709914-cbb1b2748e13?w=400&q=70',
    journey: 'https://images.unsplash.com/photo-1653545709914-cbb1b2748e13?w=400&q=70',
    auli: 'https://images.unsplash.com/photo-1653545709914-cbb1b2748e13?w=400&q=70',
    village: 'https://images.unsplash.com/photo-1689676452888-c9ccc1896e96?w=400&q=70',
    valley: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=70',
    soul: 'https://images.unsplash.com/photo-1687511741630-18fe16e8ed7e?w=400&q=70',
    people: 'https://images.unsplash.com/photo-1751796883240-1b9b39ecb967?w=400&q=70',
    land: 'https://images.unsplash.com/photo-1758431244850-c53fe26acc3a?w=400&q=70',
    craft: 'https://images.unsplash.com/photo-1671881641527-0a1ee842e13e?w=400&q=70',
    taste: 'https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=400&q=70'
  };
  return MAP[key] || 'https://images.unsplash.com/photo-1653545709914-cbb1b2748e13?w=400&q=70';
}

function openPackageModal(id) {
  const p = id ? S.packages.find(x => x.id === id) : null;
  const isEdit = !!p;
  showModal(`
    <div class="modal-head">
      <h3>${isEdit ? 'Edit Package' : 'Add New Package'}</h3>
      <button class="btn-action" onclick="closeModal()">✕ Close</button>
    </div>
    <form onsubmit="event.preventDefault();submitPackage(this,${isEdit})">
      <div class="modal-body-row">
        <div class="modal-field">
          <label>Package Title *</label>
          <input name="title" value="${esc(p?.title||'')}" required placeholder="e.g. Auli Winter Getaway">
        </div>
        <div class="modal-field">
          <label>ID / Slug</label>
          <input name="id" value="${esc(p?.id||'')}" ${isEdit?'readonly style="opacity:.6"':''} placeholder="auli-winter-getaway">
        </div>
      </div>
      <div class="modal-body-row">
        <div class="modal-field">
          <label>Category</label>
          <select name="category">
            ${['Destinations','Treks','Homestays','Retreats','Expeditions','Pilgrimages'].map(c =>
              `<option value="${c}" ${p?.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="modal-field">
          <label>Duration</label>
          <input name="duration" value="${esc(p?.duration||'3 Days')}" placeholder="e.g. 3 Days">
        </div>
      </div>
      <div class="modal-body-row">
        <div class="modal-field">
          <label>Price (₹) *</label>
          <input name="price" type="number" value="${p?.price||''}" required placeholder="9999">
        </div>
        <div class="modal-field">
          <label>Elevation</label>
          <input name="elevation" value="${esc(p?.elevation||'')}" placeholder="e.g. 2,500 – 3,050 m">
        </div>
      </div>
      <div class="modal-body-row">
        <div class="modal-field">
          <label>District / Valley</label>
          <input name="district" value="${esc(p?.district||'')}" placeholder="e.g. Chamoli · Garhwal Himalaya">
        </div>
        <div class="modal-field">
          <label>Best Season</label>
          <input name="season" value="${esc(p?.season||'')}" placeholder="e.g. May–October">
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:14px">
        <label>Photo URL or Key (p1, hero, auli, village, etc.)</label>
        <input name="photoKey" value="${esc(p?.photoKey||'journey')}" placeholder="e.g. journey or https://images.unsplash.com/...">
        <div style="font-size:10px;color:var(--tx3);margin-top:5px">Keys: hero, journey, auli, village, valley, soul, people, land, craft — or paste a full image URL</div>
      </div>
      <div class="modal-field" style="margin-bottom:14px">
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="A short summary visible on package card…">${esc(p?.description||'')}</textarea>
      </div>
      <div class="modal-field" style="margin-bottom:14px">
        <label>Highlights</label>
        <textarea name="highlights" rows="2" placeholder="Key highlights, comma-separated or prose…">${esc(p?.highlights||'')}</textarea>
      </div>
      <div class="modal-field" style="margin-bottom:14px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);cursor:pointer;text-transform:none;letter-spacing:normal">
          <input type="checkbox" name="isAvailable" ${!p || p.isAvailable ? 'checked' : ''} style="width:16px;height:16px">
          Package is Active &amp; Shown on Website
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-action" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-action gold">${isEdit?'Save Changes':'Publish Package'}</button>
      </div>
    </form>
  `);
}

async function submitPackage(form, isEdit) {
  const data = {
    id: form.id.value.trim() || undefined,
    title: form.title.value.trim(),
    category: form.category.value,
    duration: form.duration.value.trim(),
    price: Number(form.price.value),
    elevation: form.elevation.value.trim(),
    district: form.district.value.trim(),
    season: form.season.value.trim(),
    photoKey: form.photoKey.value.trim() || 'journey',
    description: form.description.value.trim(),
    highlights: form.highlights.value.trim(),
    isAvailable: form.isAvailable.checked
  };
  try {
    if (isEdit) {
      const pkg = S.packages.find(x => x.id === form.id.value.trim());
      await api('PUT', `/packages/${encodeURIComponent(pkg?.id || form.id.value.trim())}`, data);
      toast('Package updated!', 'success');
    } else {
      await api('POST', '/packages', data);
      toast('Package published!', 'success');
    }
    closeModal();
    await loadPackages();
  } catch (e) { toast(e.message, 'error'); }
}

async function deletePackage(id) {
  if (!confirm(`Remove package "${id}" from the website?`)) return;
  try {
    await api('DELETE', `/packages/${encodeURIComponent(id)}`);
    toast('Package removed', 'info');
    await loadPackages();
  } catch (e) { toast(e.message, 'error'); }
}

/* ═════════════════════════════════════════
   TRIPS TAB
═══════════════════════════════════════════ */
async function loadTrips() {
  const data = await api('GET', '/trips');
  S.trips = data.trips || [];
  updateBadges();
  const tripStatusBadge = s => {
    const m = { new:'badge-transit', contacted:'badge-confirmed', itinerary_sent:'badge-packaged', confirmed:'badge-delivered', completed:'badge-delivered', cancelled:'badge-cancelled' };
    return `<span class="badge ${m[s]||'badge-transit'}">${(s||'new').replace(/_/g,' ')}</span>`;
  };
  const mc = document.getElementById('main-content');
  mc.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Tourism Leads</div><div class="page-sub">${S.trips.length} journey requests received</div></div>
      <button class="btn-sm btn-outline" onclick="loadTrips()">Refresh</button>
    </div>
    <div class="table-wrap">
      ${S.trips.length === 0 ? `<div class="empty-state"><div class="icon">—</div><p>No tourism leads yet.</p></div>` : `
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Destination</th><th>Style</th><th>Travelers</th><th>Stay</th><th>Contact</th><th>Status</th><th>Received</th><th>Action</th></tr></thead>
        <tbody>${S.trips.map(t => `
          <tr>
            <td><strong>${esc(t.destination||'—')}</strong></td>
            <td style="color:var(--tx3)">${esc(t.journeyStyle||'—')}</td>
            <td style="color:var(--tx3)">${esc(t.travelers||'—')}</td>
            <td style="color:var(--tx3)">${esc(t.stayPreference||'—')}</td>
            <td style="font-size:11px;color:var(--tx3)">${esc(t.contactEmail||t.contactPhone||'—')}</td>
            <td>${tripStatusBadge(t.status)}</td>
            <td style="color:var(--tx3);font-size:11px">${t.createdAt ? new Date(t.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}) : '—'}</td>
            <td><button class="btn-action gold" onclick="openTripModal('${t._id}')">Manage</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>`}
    </div>
  `;
}

function openTripModal(id) {
  const t = S.trips.find(x => x._id === id);
  if (!t) return;
  showModal(`
    <div class="modal-head">
      <h3>Tourism Lead — ${esc(t.destination||'')}</h3>
      <button class="btn-action" onclick="closeModal()">✕ Close</button>
    </div>
    <div style="background:var(--card);border:1px solid var(--border2);border-radius:5px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.8">
      <div><strong>Destination:</strong> ${esc(t.destination||'—')}</div>
      <div><strong>Style:</strong> ${esc(t.journeyStyle||'—')} · <strong>Travelers:</strong> ${esc(t.travelers||'—')}</div>
      <div><strong>Stay:</strong> ${esc(t.stayPreference||'—')}</div>
      <div><strong>Contact:</strong> ${esc(t.contactEmail||t.contactPhone||'—')}</div>
      ${t.startDate ? `<div><strong>Start Date:</strong> ${new Date(t.startDate).toLocaleDateString('en-IN')}</div>` : ''}
      ${t.quotePrice ? `<div><strong>Quote:</strong> ₹${Number(t.quotePrice).toLocaleString('en-IN')}</div>` : ''}
      ${t.assignedGuide ? `<div><strong>Guide:</strong> ${esc(t.assignedGuide)}</div>` : ''}
      ${t.notes ? `<div style="margin-top:8px;font-style:italic;color:var(--tx3)">"${esc(t.notes)}"</div>` : ''}
    </div>
    <form onsubmit="event.preventDefault();submitTrip('${t._id}',this)">
      <div class="modal-body-row">
        <div class="modal-field">
          <label>Lead Status</label>
          <select name="status">
            ${[['new','New — Pending Contact'],['contacted','Contacted via Phone/Email'],['itinerary_sent','Custom Itinerary Sent'],['confirmed','Confirmed & Booked'],['completed','Journey Completed'],['cancelled','Cancelled']].map(([v,l]) =>
              `<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="modal-field">
          <label>Start Date</label>
          <input name="startDate" type="date" value="${t.startDate ? String(t.startDate).substring(0,10) : ''}">
        </div>
      </div>
      <div class="modal-body-row">
        <div class="modal-field">
          <label>Assigned Guide</label>
          <input name="assignedGuide" value="${esc(t.assignedGuide||'')}" placeholder="e.g. Ramesh Singh">
        </div>
        <div class="modal-field">
          <label>Quote Price (₹)</label>
          <input name="quotePrice" type="number" value="${t.quotePrice||''}" placeholder="e.g. 15000">
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:0">
        <label>Vendor Notes</label>
        <textarea name="adminNotes" rows="3" placeholder="Guide assignment, customer notes…">${esc(t.adminNotes||'')}</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-action" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-action gold">Save Lead Status</button>
      </div>
    </form>
  `);
}

async function submitTrip(id, form) {
  try {
    await api('PUT', `/trips/${encodeURIComponent(id)}/status`, {
      status: form.status.value,
      adminNotes: form.adminNotes.value.trim(),
      quotePrice: form.quotePrice.value ? Number(form.quotePrice.value) : undefined,
      assignedGuide: form.assignedGuide.value.trim(),
      startDate: form.startDate.value || undefined
    });
    toast('Lead status updated!', 'success');
    closeModal();
    await loadTrips();
  } catch (e) { toast(e.message, 'error'); }
}

/* ═════════════════════════════════════════
   MODAL / TOAST / UTILS
═══════════════════════════════════════════ */
function showModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-backdrop')) return;
  document.getElementById('modal-backdrop').classList.remove('open');
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function updateBadges() {
  const pb = document.getElementById('pending-badge');
  const tb = document.getElementById('trips-badge');
  if (pb && S.stats) pb.textContent = S.stats.pendingOrders || 0;
  if (tb && S.stats) tb.textContent = S.stats.newTrips || 0;
  if (S.orders.length > 0) {
    const pending = S.orders.filter(o => o.orderStatus === 'confirmed' || o.orderStatus === 'harvest_packaged').length;
    if (pb) pb.textContent = pending;
  }
  if (S.trips.length > 0) {
    const newT = S.trips.filter(t => !t.status || t.status === 'new').length;
    if (tb) tb.textContent = newT;
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-backdrop').classList.remove('open');
});

/* ═════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
(async function init() {
  if (S.token) {
    const valid = await verifySession();
    if (valid) { showShell(); return; }
  }
  document.getElementById('login-screen').style.display = 'flex';
})();
</script>
