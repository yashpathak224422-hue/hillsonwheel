,"04 / The Journey","Curated experiences. Unforgettable journeys.","Curated journeys — homestays, treks, retreats, culture.",[["auli","Auli Getaway","3 Days · ₹9,999","dest"],["nandadevi","Nanda Devi Base Camp","7 Days · ₹21,999","dest"],["village","Village Homestay","2 Days · ₹3,999","dest"],["tungnath","Chopta Tungnath Trek","4 Days · ₹12,999","dest"]]],people:["people","05 / The People","Real people. Real stories.","Farmers, artisans, cooks, guides and families across the ridges.",[["buranshtree","Maya Devi · Chamoli","Beekeeper of the high valleys.","stories"],["aipanartisan","Ramesh Singh · Almora","Third-generation weaver.","stories"],["chholiya","Lata Bisht · Pithoragarh","Keeper of village folk songs.","stories"],["terraces","Gopal Dutt · Uttarkashi","Heirloom apple & grain farmer.","stories"]]],soul:["kedarnath","06 / The Soul","Traditions. Festivals. Heritage.","Calm, timeless, respected.",[["jageshwar","Temples & Shrines","Stone, silence and temple bells.","stories"],["badrinath","Pahadi Festivals","Harvest, music and the gods.","stories"],["laxmanjhula","Mountain Mythology","Stories older than the roads.","stories"],["devprayag","Sacred Rivers","Where the holy streams unite.","stories"]]],stories:["village","Stories","The stories of the hills.","Hidden places, food, people, festivals.",[["mana","The Last Village of India","Mana, at the edge of the map.","about"],["honey","A Taste of Tradition","Honey from wild rhododendron.","bazaar"],["chholiya","Women of the Mountains","Hands that hold villages together.","people"],["binsar","Monsoon in Kumaon","When clouds sleep in pine forests.","land"]]],about:["heaven","About Hillsonwheels","ONE LAND. MANY STORIES.","Hillsonwheels connects India with the land, culture, products, people and journeys of Uttarakhand.",[["kausani","The Hills","Where peaks guard ancient heritage.","land"],["chholiya","The People","Custodians of mountain knowledge.","people"],["taste","The Produce","Pure nectar, grains and wild herbs.","bazaar"],["tungnath","The Journeys","Paths off the standard itinerary.","journey"],["kedarnath","The Spirit","Timeless devotion and reverence.","soul"]]],dest:["auli","Destination","Auli","Skiing, high alpine meadows, and mountain magic.",[["auli","Auli Getaway","3 Days · ₹9,999","custom"],["tungnath","Chopta Trek","4 Days · ₹12,999","custom"],["nandadevi","Nanda Devi Sanctuary","7 Days · ₹21,999","custom"]]]},DETAIL_CONTENT={"wool-loom":{type:"Craft",title:"Wool & Loom",image:"craft",summary:"A woven thread carries warmth, skill and the character of the place it comes from.",sections:[["The material","Wool has long been valued for warmth in Himalayan life. Fibre, weave and finish vary with makers, materials and the needs of the household."],["The making","Preparing yarn and weaving ask for patience and close attention. Skills are learned through practice, observation and the sharing of knowledge across generations."],["Why it matters","Value the maker as well as the object: ask who made it, how it was made and how to care for it."]],back:"craft",shop:!0},"aipan-art":{type:"Craft",title:"Aipan Art",image:"aipan-weave",summary:"A line of white against a red ground can turn a threshold into a place of welcome. Aipan is an art of pattern, occasion and care.",sections:[["A living art","Aipan is a traditional folk art associated with Kumaon. Designs are commonly made with white rice paste over a prepared red or ochre ground, though practice can vary."],["Patterns with purpose","Aipan appears in homes and ritual settings, often for particular occasions. The meanings of designs are best learned from people who practise the art."],["Made for today","Artists continue to interpret Aipan in new forms. Appreciate it by crediting the artist and learning its context, not treating a living tradition as decoration alone."]],back:"craft",shop:!0},"the-weaver":{type:"Makers",title:"The Weaver",image:"aipanartisan",summary:"Behind every woven piece is a maker who knows how a thread behaves, how a pattern grows and how a finished cloth should serve the person who uses it.",sections:[["Knowledge in the hands","Weaving brings together material knowledge, rhythm and design. Much of that understanding is built slowly—by watching, practising and learning from experienced makers."],["A livelihood, a legacy","Fair recognition means crediting makers where they wish to be named and respecting their ownership of their work."],["Look closer","Notice the texture, edges and small variations that reveal the work of a human hand. Ask about the material, process and care."]],back:"craft",shop:!0},"terrace-farming":{type:"People & Spirit",title:"Life on the Terraces",image:"terraces",summary:"Terraced fields turn steep slopes into carefully held ground. They are shaped by seasonal work and the people who keep returning to the soil.",sections:[["Reading the season","Crops and calendars vary with elevation, water and local conditions. Farmers make decisions by observing rain, soil and the changing year."],["More than a view","Terraces are working landscapes. Their walls, paths and water channels need care, and their harvests connect households to local food traditions."],["A changing future","Migration, shifting rainfall and access to markets all affect mountain farming. Listening to farmers matters when considering what might help."]],back:"people"},"mountain-craft":{type:"People & Spirit",title:"Craft, Skill & Community",image:"craft",summary:"A handmade object can hold a map of local materials, family teaching and creative decisions. Craft is not frozen in the past; it changes as makers shape what comes next.",sections:[["Made with knowledge","Textiles, bamboo work, woodwork and folk arts each call for their own tools and techniques."],["Keeping skill visible","Learning opportunities, fair payment and proper credit help craft knowledge remain valued."],["Tradition in motion","New forms can sit alongside inherited techniques. Ask who is making the work, who benefits and whether the tradition is represented with respect."]],back:"people"},"folk-music":{type:"People & Spirit",title:"Songs Carried Through the Hills",image:"chholiya",summary:"Songs travel through memory, gatherings and the voices of people who know the words by heart.",sections:[["Many voices","Uttarakhand holds varied musical traditions across regions and languages. Songs may accompany celebration, devotion, work or storytelling."],["A shared practice","Music is often experienced together. Instruments, rhythms and words can carry meanings specific to their community."],["Listen with respect","Recordings and performances deserve credit and consent. Seek context and permission from the people who keep a song alive."]],back:"people"},"village-shrines":{type:"People & Spirit",title:"Shrines, Faith & Place",image:"jageshwar",summary:"A shrine may be a place of prayer and a thread in the community’s relationship with its surroundings. Its meaning belongs first to the people who care for it.",sections:[["Local sacred geographies","Places of worship and reverence take many forms. Their histories and practices are distinct."],["Everyday devotion","Faith can be present in seasonal gatherings, household practice and the care given to a sacred place."],["Visit thoughtfully","Ask before photographing people or ceremonies, follow local guidance and treat a living place of worship with respect."]],back:"people"},"seasonal-gatherings":{type:"People & Spirit",title:"Festivals & Seasonal Gatherings",image:"badrinath",summary:"A gathering can mark a season, renew relationships and bring music, food and custom into shared view.",sections:[["Rooted in locality","Celebrations vary across Uttarakhand. Their timing, stories and practices belong to particular communities."],["More than a spectacle","For residents, a festival can be an act of devotion, memory and belonging. Visitors are guests in that moment."],["Be a considerate guest","Follow local instructions, ask before taking photographs and support community-led events in ways residents welcome."]],back:"people"},"river-reverence":{type:"People & Spirit",title:"Rivers & Reverence",image:"devprayag",summary:"Mountain rivers shape valleys and daily life. For many people they also hold deep spiritual meaning.",sections:[["A living watershed","Streams connect forests, settlements and farms. Their health depends on the wider landscape and the choices made throughout a catchment."],["Meaning and responsibility","Reverence may be expressed through prayer, custom and care. Protecting riverbanks from waste is a practical way to show regard."],["Leave no trace","Carry rubbish out, use established access points and follow safety guidance. Waterways are powerful natural systems."]],back:"people"}},BLOGS=[{id:"terraces-and-seasons",category:"Land & Living",title:"The Quiet Architecture of a Terraced Field",image:"terraces",dek:"Across a steep hillside, stone edges hold more than soil: they hold the work of many seasons.",read:"5 min read",paragraphs:["From a distance, a mountain terrace can look like a pattern drawn across a slope. Up close, it is carefully shaped ground where crops can grow on difficult terrain.","Each terrace depends on attention: walls need care, water must be managed and the work follows local seasons. What grows, and when, varies with altitude, weather and household choices.","These fields are not scenery set aside for a visitor. They are lived and worked places. A thoughtful walk keeps to paths, asks before entering fields and recognises the people whose labour sustains the landscape."]},{id:"grain-to-kitchen",category:"Food & Memory",title:"From Mountain Grain to the Family Kitchen",image:"pahadi-pulses",dek:"Mandua, jhangora, bhatt and gahat each bring a different story of soil, season and cooking.",read:"4 min read",paragraphs:["The names of Uttarakhand’s grains and pulses are more than entries on a menu. Mandua, jhangora, bhatt and gahat each have their own texture and place in regional foodways.","Recipes are not fixed in one form. Ingredients and methods shift between households and regions, shaped by what is available and what people have learned to cook well. Dishes such as kafuli and chainsoo carry that everyday creativity.","To learn a food tradition, start with the cook. Ask how an ingredient is chosen, prepared and served, and credit the people whose knowledge makes the meal possible."]},{id:"aipan-and-welcome",category:"Art & Craft",title:"Aipan: A Pattern Made for a Moment",image:"aipan-weave",dek:"Kumaoni Aipan brings line, ground and occasion together in a living folk-art practice.",read:"4 min read",paragraphs:["Aipan is a traditional folk art associated with Kumaon. Commonly made with white rice paste on a red or ochre ground, its patterns are connected with homes and ritual occasions.","There is no single pattern that explains every practice. Designs and meanings can vary, and the most thoughtful way to learn is from the artists and families who continue the work.","Aipan continues to find new forms, but the tradition remains more than a motif. Credit the artist, ask about context and let the maker guide how their work is represented."]},{id:"visiting-with-care",category:"Travel & Respect",title:"How to Be a Thoughtful Guest in a Mountain Village",image:"village",dek:"A slower visit begins with listening—to local guidance, daily rhythms and the limits of the landscape.",read:"3 min read",paragraphs:["A village is someone’s home before it is anyone’s destination. Begin by following local guidance and asking before photographing people, homes or ceremonies.","Stay on paths, keep noise low and take rubbish back with you. Water and road access can be limited, so conserve water, avoid waste and support local businesses where residents welcome it.","The best visit is not measured by how much you consume. It is measured by how carefully you listen, how lightly you travel and whether the community has a say in how visitors are welcomed."]}],FOOTER_PAGES={"footer-contact":{title:"Contact Us",eyebrow:"WE’RE HERE TO HELP",intro:"Questions about a journey, a product or an order? Reach the Hillsonwheels team through the channel that works best for you.",sections:[{title:"Email",body:"Write to howsmailbox@gmail.com for general enquiries, order questions and customer support."},{title:"Customer care",body:"Call or WhatsApp +91 8218359120."},{title:"Visit",body:"Haldwani: 53/A, Haridutt Vihar, Rampur Road, Haldwani (Nainital), Uttarakhand 263139. Delhi: C-49, Vishwakarma Colony, M.B. Road, New Delhi 110047."}]},"footer-terms":{title:"Terms & Conditions",eyebrow:"A CLEAR UNDERSTANDING",intro:"These terms explain the basic expectations for using Hillsonwheels and placing an order or booking through the website.",sections:[{title:"Using this website",body:"Please provide accurate information when making an enquiry, placing an order or booking a journey. Website content, photographs and availability may change as products, seasons and local conditions change."},{title:"Products and journeys",body:"Descriptions are intended to help you make an informed choice. Handmade goods can naturally vary, and travel plans may need adjustment for weather, road access, safety or local guidance. We will share material changes with affected customers."},{title:"Orders and payment",body:"An order or booking is confirmed only after the required payment and confirmation from Hillsonwheels. Applicable prices and charges are shown during checkout or in the booking details. Please review the relevant billing, delivery, cancellation and return information before proceeding."},{title:"Questions",body:"For help with these terms, email howsmailbox@gmail.com or contact customer care at +91 8218359120."}]},"footer-billing":{title:"Billing Terms and Conditions",eyebrow:"PAYMENTS & CONFIRMATIONS",intro:"A straightforward guide to the payment and billing details for Hillsonwheels orders and bookings.",sections:[{title:"Prices and ch 8218359120."]]},"footer-delivery":{title:"Delivery Policy",eyebrow:"FROM OUR HILLS TO YOUR HOME",intro:"We work to get local goods to you carefully, with delivery arrangements suited to the product and destination.",sections:[{title:"Processing and dispatch",body:"Processing time can vary by product and availability. Dispatch information and any available delivery estimate are shared with your order confirmation or update."},{title:"Tracking and delivery",body:"Where a tracked carrier is used, tracking details are shared after dispatch. Delivery times may be affected by remote addresses, carrier operations, weather or other circumstances outside our control."},{title:"Please check your parcel",body:"Please check the package when it arrives. If an item is damaged or incorrect, contact customer care within 48 hours of delivery with your order reference and photographs."},{title:"Need help?",body:"Email howsmailbox@gmail.com or call/WhatsApp +91 8218359120 with your order reference."}]},"footer-privacy":{title:"Privacy Policy",eyebrow:"YOUR INFORMATION, HANDLED WITH CARE",intro:"Hillsonwheels uses the information you share to respond to enquiries and manage orders, bookings and customer support.",sections:[{title:"Information we use",body:"This may include contact details, delivery or booking information and the details needed to respond to your request or provide the service you selected."},{title:"How it is used",body:"Information is used to process and communicate about an order or booking, provide support, and meet applicable operational or legal requirements. Relevant details may be shared with service providers involved in payment, delivery or travel arrangements, only as needed to fulfil the service."},{title:"Payments and your choices",body:"Full payment-card credentials are not stored on this website; payment is handled through the payment option presented at checkout. To ask about personal information associated with your order or enquiry, contact howsmailbox
