<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Mountain Trail Not Found | HillsOnWheels</title>
  <meta name="robots" content="noindex, follow">
  <meta name="generator" content="Custom Engineering — Bespoke Vanilla JS, HTML5, CSS3, Node.js">
  <meta name="author" content="Yash Pathak & HillsOnWheels Engineering Team">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0E0C;
      --gold: #C5A869;
      --tx: #EAE5D8;
      --muted: #888E82;
      --sans: 'Manrope', Inter, sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--tx);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 400;
      color: var(--tx);
      line-height: 1.05;
      margin-bottom: 16px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 300;
    }
    .btn {
      background: none;
      border: 1px solid var(--gold);
      padding: 14px 32px;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: var(--gold);
      color: var(--bg);
      box-shadow: 0 8px 24px rgba(197, 168, 105, 0.2);
    }
    .footer-note {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: #4a4d46;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="badge">Elevation Uncharted</div>
  <h1>Trail Not Found</h1>
  <p>The path you are exploring does not exist or has been relocated to another ridge in the Himalayas.</p>
  <a href="/" class="btn">Return to Basecamp</a>
  <div class="footer-note">HillsOnWheels &bull; Bespoke Custom Mountain Platform</div>
</body>
</html>
