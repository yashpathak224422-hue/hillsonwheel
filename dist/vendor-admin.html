-pill.down{background:rgba(239,68,68,.12);color:var(--red)}.table-wrap{background:var(--card2);border:1px solid var(--border2);border-radius:7px;overflow:hidden}.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border2);gap:12px;flex-wrap:wrap}.table-title{font-weight:700;font-size:14px}table{width:100%;border-collapse:collapse;font-size:12.5px}thead th{background:#0d0e0b;color:var(--tx3);padding:12px 16px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.8px;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}tbody td{padding:14px 16px;border-bottom:1px solid #111310;vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:rgba(255,255,255,.018)}.empty-state{text-align:center;padding:52px 20px;color:var(--tx3)}.empty-state .icon{font-size:36px;margin-bottom:12px}.empty-state p{font-size:13px}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}.badge-confirmed{background:rgba(59,130,246,.12);color:#60a5fa}.badge-packaged{background:rgba(168,85,247,.12);color:#c084fc}.badge-dispatched{background:rgba(249,115,22,.14);color:#fb923c}.badge-transit{background:rgba(234,179,8,.12);color:#facc15}.badge-delivery{background:rgba(6,182,212,.12);color:#22d3ee}.badge-delivered{background:rgba(34,197,94,.12);color:#4ade80}.badge-cancelled{background:rgba(239,68,68,.12);color:#f87171}.badge-paid{background:rgba(34,197,94,.12);color:#4ade80}.badge-pending{background:rgba(234,179,8,.12);color:#facc15}.badge-cod{background:rgba(249,115,22,.12);color:#fb923c}.badge-refunded{background:rgba(239,68,68,.12);color:#f87171}.btn-action{padding:5px 12px;border-radius:4px;font:600 11px/1 var(--sans);cursor:poin  onclick='window.location.href="/"'>← Return to Storefront</a></div></div></div><div id="shell"><div class="topbar"><div class="topbar-left"><span class="topbar-brand">HILLSONWHEELS</span> <span class="topbar-badge">Vendor Console</span></div><div class="topbar-right"><span class="topbar-user">Signed in as <strong id="top-user">admin@1234</strong></span> <button class="btn-sm btn-outline" onclick='window.open("/","_blank")'>View Storefront</button> <button class="btn-sm btn-danger" onclick="doLogout()">Sign Out</button></div></div><div class="layout"><nav class="sidebar"><div class="sidebar-section">Main</div><div class="nav-item active" data-tab="overview" onclick='switchTab("overview")'><span class="icon">•</span> Overview</div><div class="sidebar-section">Operations</div><div class="nav-item" data-tab="orders" onclick='switchTab("orders")'><span class="icon">•</span> Orders <span class="nav-badge" id="pending-badge">0</span></div><div class="nav-item" data-tab="products" onclick='switchTab("products")'><span class="icon">•</span> Products</div><div class="nav-item" data-tab="packages" onclick='switchTab("packages")'><span class="icon">•</span> Packages</div><div class="nav-item" data-tab="trips" onclick='switchTab("trips")'><span class="icon">•</span> Tourism Leads <span class="nav-badge" id="trips-badge">0</span></div></nav><main class="main" id="main-content"><div class="loading"><div class="spinner"></div>Loading dashboard…</div></main></div></div><div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)"><div class="modal-box" id="modal-box"></div></div><div id="toast-container"></div><script>const S={token:localStorage.getItem("hsw_admin_token")||"",user:null,tab:"overview",stats:null,orders:[],products:[],packages:[],trips:[],search:"",statusFilter:"all"};async function handleLogin(e){e.preventDefault();const t=document.getElementById("login-btn"),a=document.getElementById("login-error"),n=document.getElementById("u-id").value.trim(),s=document.getElementById("u-pw").value;t.disabled=!0,t.textContent="Authenticating…",a.textContent="";try{const e=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:n,password:s})}),t=await e.json();if(!e.ok)throw new Error(t.error||"Authentication failed.");S.token=t.token,S.user=t.admin,localStorage.setItem("hsw_admin_token",t.token),document.getElementById("top-user").textContent=S.user?.username||n,showShell()}catch(e){a.textContent=e.message,t.disabled=!1,t.textContent="Authenticate & Enter Console"}}async function verifySession(){if(!S.token)return!1;try{const e=await fetch("/api/admin/verify",{headers:{Authorization:`Bearer ${S.token}`}});if(!e.ok)return doLogout(!1),!1;const t=await e.json();return S.user=t,document.getElementById("top-user").textContent=t.username||"admin@1234",!0}catch{return!1}}function doLogout(e=!0){S.token="",S.user=null,localStorage.removeItem("hsw_admin_token"),fetch("/api/admin/logout",{method:"POST"}).catch(()=>{}),e&&toast("Signed out from Admin Console","info"),document.getElementById("login-screen").style.display="flex",document.getElementById("shell").classList.remove("visible"),document.getElementById("u-pw").value="",document.getElementById("login-btn").disabled=!1,document.getElementById("login-btn").textContent="Authenticate & Enter Console"}function showShell(){document.getElementById("login-screen").style.display="none",document.getElementById("shell").classList.add("visible"),switchTab("overview")}async function api(e,t,a){const n={method:e,headers:{Authorization:`Bearer ${S.token}`}};a&&(n.headers["Content-Type"]="application/json",n.body=JSON.stringify(a));const s=await fetch("/api/admin"+t,n);if(401===s.status)throw doLogout(!1),new Error("Session expired.");const i=204===s.status?{}:await s.json();if(!s.ok)throw new Error(i.error||"Request failed");return i}function switchTab(e){S.tab=e,document.querySelectorAll(".nav-item").forEach(t=>{t.classList.toggl
